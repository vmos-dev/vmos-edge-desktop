appId: com.vmos.edge.desktop
productName: VMOS Edge 2.0
asar: true
compression: maximum
# 将 @vmosedge/proxy-sdk 整个包从 asar 中排除，因为包含可执行文件无法在 asar 中运行
asarUnpack:
  - '**/node_modules/@vmosedge/proxy-sdk/**'
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
  - '!resources/*' # resources 目录我们通过 extraFiles/extraResources 处理，不需要进 asar
  - '!**/node_modules/@vmosedge/proxy-sdk/bin/**/*' # 彻底从 asar 中排除 bin 目录，避免 SDK 误判路径

extraResources:
  - from: resources/adi
    to: adi
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

win:
  icon: build/icon.ico
  executableName: vmos-edge-2.0

  extraResources:
    - from: resources/win
      to: win
    # Windows 平台：只复制 win32-x64 的二进制文件
    - from: 'node_modules/@vmosedge/proxy-sdk/bin/win32-x64'
      to: 'vmosedge-proxy-sdk/bin/win32-x64'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # 国际化支持：中文 (zh_CN) 和 英文 (en_US)
  # 安装程序会自动检测系统语言
  installerLanguages:
    - zh_CN
    - en_US
  # 自定义背景图配置 (需要将图片放入 build 目录)
  # 侧边栏图片: 164x314 (bmp)
  # installerSidebar: build/installerSidebar.bmp
  # 顶部图片: 150x57 (bmp)
  # installerHeader: build/installerHeader.bmp
mac:
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: resources/mac-${arch}
      to: mac-${arch}
    # Mac 平台：根据架构复制对应的 darwin 二进制文件
    - from: 'node_modules/@vmosedge/proxy-sdk/bin/darwin-${arch}'
      to: 'vmosedge-proxy-sdk/bin/darwin-${arch}'
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon-linux.png
  extraResources:
    - from: resources/linux
      to: linux
    # Linux 平台：只复制 linux-x64 的二进制文件
    - from: 'node_modules/@vmosedge/proxy-sdk/bin/linux-x64'
      to: 'vmosedge-proxy-sdk/bin/linux-x64'
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
